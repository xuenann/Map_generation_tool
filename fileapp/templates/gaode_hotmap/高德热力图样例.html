<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>高德热力图样例</title>
    <link rel="stylesheet" href="https://a.amap.com/jsapi_demos/static/demo-center/css/demo-center.css"/>
    <style>
        html, body, #container {
            height: 100%;
            width: 100%;
        }
        .amap-icon img{
            width: 20px;
            height: 29px;
        }
        .custom-content-marker {
            font-size: 14px;
            font-weight: bold;
        }
        #map-features .input-item {
            height: 2rem;
        }
        
        .context_menu{
            position: relative;
            min-width: 12rem;
            padding: 0;
        }
        .context_menu p{
            cursor: pointer;
            padding: 0.25rem 1.25rem;
        }
        .context_menu p:hover{
            background: #ccc;
        }
        /* 切换按钮样式 */
        .toggle-container {
            text-align: right;
            margin-bottom: 10px;
        }
        
        .toggle-btn {
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .toggle-btn:hover {
            background-color: #e0e0e0;
        }
        
        .toggle-icon {
            font-size: 10px;
            transition: transform 0.3s ease;
        }
        
        .input-card.hidden {
            height: 40px;
            overflow: hidden;
        }
        
        .info.hidden {
            height: 40px;
            overflow: hidden;
        }
        
    </style>
</head>
<body>
<div id="container"></div>

<div class="input-card" style="width:24rem;">
    <div class="toggle-container">
        <button class="toggle-btn" onclick="toggleInputCard()">
            <span class="toggle-icon">▼</span> 收起工具
        </button>
    </div>
    <h4>地图自适应</h4>
    <input id="setFitView" type="button" class="btn" value="地图自适应显示" />

    <h4>设置地图当前行政区</h4>
    <div class="input-item">
      <input id='city-name' placeholder="北京市" type="text" style="margin-right:1rem;"><button class="btn" id="query">去指定城市</button>
    </div>

    <div class="input-item">
      <label>卫星图层：</label>
      <button class="btn" id="add-satellite-layer" style="margin-right:1rem;">添加卫星图层</button>
      <button class="btn" id="remove-satellite-layer">删除卫星图层</button>
    </div>
    <div class="input-item">
      <label>红色标记：</label>
      <button class="btn" id="add-roadnet-layer" style="margin-right:1rem;">添加路网图层</button>
      <button class="btn" id="remove-roadnet-layer">删除路网图层</button>
    </div>

    <div class="input-item">
        <input type="checkbox" checked onclick="toggleScale(this)"/>比例尺
        <input type="checkbox" style="margin-left:2rem;" checked id="controlBar" onclick="toggleControlBar(this)"/>工具条方向盘
    </div>

    <h4>设置地图显示要素（Features）</h4>
    <div id="map-features">
      <div class="input-item">
        <input type='checkbox' name='mapStyle' value='bg' checked>区域面（bg）
        <input type='checkbox' name='mapStyle' value='road' checked>道路（road）
      </div>
      <div class="input-item">
        <input type='checkbox' name='mapStyle' value='point' checked>标注（point）
        <input type='checkbox' name='mapStyle' value='building' checked>建筑物（building）
      </div>
    </div>

    <div>
        <label>图层透明度：</label><span id="opa-val"></span>
        <br>
        <input id="opacity" type="range" value="1" min="0" max="1" step="0.01">
    </div>
    
</div>

<div class="info">
    <div class="toggle-container">
        <button class="toggle-btn" onclick="toggleInfoCard()">
            <span class="toggle-icon">▼</span> 收起信息
        </button>
    </div>
    <!-- <h4>获取地图级别与中心点坐标</h4> -->
    <p style="font-size: 1.2rem;">当前地图级别：<span id="map-zoom">13</span></p>
    <p style="font-size: 1.2rem;">当前地图中心点坐标：<span id="map-center">116.397428, 39.90923</span></p>

    <p style="font-size: 1.2rem;">左击获取经纬度：<span id="lnglat">116.397428, 39.90923</span></p>

    <!-- <h4>当前所在行政区信息</h4> -->
    <p style="font-size: 1.2rem;"><span id="map-city"></span></p>

    <!-- <div id="centerCoord"></div>
    <div id="tips"></div> -->
</div>
<script type="text/javascript"
        src="https://webapi.amap.com/maps?v=2.0&key=c0ffe5d8f12e85d62c3ed7b0e4835a45&&plugin=AMap.Scale,AMap.HawkEye,AMap.ToolBar,AMap.ControlBar,AMap.MouseTool"></script>
<script type="text/javascript" src="https://a.amap.com/jsapi_demos/static/demo-center/js/jquery-1.11.1.min.js" ></script>
<script type="text/javascript" src="https://a.amap.com/jsapi_demos/static/demo-center/js/underscore-min.js" ></script>
<script type="text/javascript" src="https://a.amap.com/jsapi_demos/static/demo-center/js/backbone-min.js" ></script>
<script type="text/javascript" src='https://a.amap.com/jsapi_demos/static/demo-center/js/prety-json.js'></script>
<script src="https://a.amap.com/jsapi_demos/static/demo-center/js/demoutils.js"></script>
<script src="https://cache.amap.com/lbs/static/es5.min.js"></script>
<script src="https://a.amap.com/jsapi_demos/static/resource/heatmapData.js"></script>
<script type="text/javascript">
    // 切换功能
    function toggleInputCard() {
        var inputCard = document.querySelector('.input-card');
        var toggleBtn = inputCard.querySelector('.toggle-btn');
        var toggleIcon = toggleBtn.querySelector('.toggle-icon');
        
        inputCard.classList.toggle('hidden');
        
        if (inputCard.classList.contains('hidden')) {
            toggleBtn.innerHTML = '<span class="toggle-icon">▶</span> 展开工具';
        } else {
            toggleBtn.innerHTML = '<span class="toggle-icon">▼</span> 收起工具';
        }
    }
    
    function toggleInfoCard() {
        var infoCard = document.querySelector('.info');
        var toggleBtn = infoCard.querySelector('.toggle-btn');
        var toggleIcon = toggleBtn.querySelector('.toggle-icon');
        
        infoCard.classList.toggle('hidden');
        
        if (infoCard.classList.contains('hidden')) {
            toggleBtn.innerHTML = '<span class="toggle-icon">▶</span> 展开信息';
        } else {
            toggleBtn.innerHTML = '<span class="toggle-icon">▼</span> 收起信息';
        }
    }
    
    // 地图控件
    var lnglat = new AMap.LngLat(116.397428, 39.90923);

    var scale = new AMap.Scale(),
    controlBar = new AMap.ControlBar({
        position: {
            top: '10px',
            left: '10px',
        }
    }),
    // 初始化地图
    map = new AMap.Map('container', {
        resizeEnable: true,     //是否监控地图容器尺寸变化
        center: [116.397428, 39.90923],
        zoom: 10,
        // viewMode: '3D',
        pitch: 0,
        features: ['bg', 'road', 'point', 'building'],
    });
    map.addControl(scale);
    map.addControl(controlBar);
    

    // 获取地图中心点/级别：显示地图层级与中心点信息
    function logMapinfo_zoom(){
      var zoom = map.getZoom(); //获取当前地图级别
      var center = map.getCenter(); //获取当前地图中心位置
      document.querySelector("#map-zoom").innerText = zoom;
      document.querySelector("#map-center").innerText = center.toString();
    };
    // 监听地图层级和中心变化事件
    map.on('zoommend', logMapinfo_zoom);
    map.on('moveend', logMapinfo_zoom);


    //获取鼠标点击经纬度：为地图注册click事件获取鼠标点击出的经纬度坐标
    map.on('click', function(e) {
        document.getElementById("lnglat").innerText = e.lnglat.getLng() + ',' + e.lnglat.getLat()
    });


    //获取当前行政区：获取并展示当前城市信息
    function logMapinfo_city(){
      map.getCity(function(info){
        // var node = new PrettyJSON.view.Node({
        //     el: document.querySelector("#map-city"),
        //     data: info
        // });
        var cityInfo = `当前所在省市区：${info.province || ''}-${info.city || ''}-${info.district || ''}`;
        document.querySelector("#map-city").innerHTML = cityInfo;
      });
    }
    // 绑定地图移动事件
    logMapinfo_city();
    map.on('moveend', logMapinfo_city);


    //设置地图当前行政区：根据cityname、adcode、citycode设置地图位置
    function gotoCity() {
      var val = document.querySelector('#city-name').value; //可以是cityname、adcode、citycode
      if (!val) {
        val = "北京市";
      }
      map.setCity(val);
      log.info(`已跳转至${val}`);
    }
    //绑定查询点击、回车事件
    document.querySelector('#query').onclick = gotoCity;
    document.querySelector('#city-name').onkeydown = function(e) {
      if (e.keyCode === 13) {
        gotoCity();
        return false;
      }
      return true;
    };
    
    
    // 图层的添加与移除：构造官方卫星、路网图层
    var satelliteLayer = new AMap.TileLayer.Satellite();
    var roadNetLayer =  new AMap.TileLayer.RoadNet();
    //批量添加图层
    //map.add([satelliteLayer, roadNetLayer]);
    // 获取建筑物选项的复选框
    var buildingCheckbox = document.querySelector("#map-features input[value='building']");
    //事件绑定
    document.querySelector("#add-satellite-layer").onclick = function() {
      map.add(satelliteLayer);
      // 添加卫星图层时，取消选中建筑物选项
      if (buildingCheckbox.checked) {
        buildingCheckbox.checked = false;
        setMapFeatures();
      }
    }
    document.querySelector("#remove-satellite-layer").onclick = function() {
      map.remove(satelliteLayer);
      // 删除卫星图层时，选中建筑物选项
      if (!buildingCheckbox.checked) {
        buildingCheckbox.checked = true;
        setMapFeatures();
      }
    }
    document.querySelector("#add-roadnet-layer").onclick = function() {
      map.add(roadNetLayer);
    }
    document.querySelector("#remove-roadnet-layer").onclick = function() {
      map.remove(roadNetLayer);
    }


    // 地图控件:添加比例尺、工具条方向盘
    function toggleScale(checkbox) {
        if (checkbox.checked) {
            scale.show();
        } else {
            scale.hide();
        }
    }
    function toggleControlBar(checkbox) {
        if (checkbox.checked) {
            controlBar.show()
        } else {
            controlBar.hide()
        }
    }


    // 地图显示要素：设置地图显示要素
    function setMapFeatures() {
      var features = [];
      var inputs = document.querySelectorAll("#map-features input");
      inputs.forEach(function(input) {
        if (input.checked) {
          features.push(input.value);
        }
      });
      map.setFeatures(features);
    }
    //绑定checkbox点击事件
    var inputs = document.querySelectorAll("#map-features input");
    inputs.forEach(function(checkbox) {
      checkbox.onclick = setMapFeatures;
    });


    // 地图透明度：
    var opacity = 1;
    // var satellite = new AMap.TileLayer.Satellite({
    //     map: map,
    //     opacity: opacity
    // });
    updateOpa(opacity);
    function updateOpa(v) {
        document.getElementById('opa-val').innerText = v;
    }
    function setOpacity(e) {
      	var val = e.target.value
        updateOpa(val);
        satelliteLayer.setOpacity(val);
    }
  	document.getElementById('opacity').addEventListener('input', setOpacity);


    //自定义菜单类
    // 标记当前是否正在绘制
    var isDrawing = false;
    // 存储所有点标记的数组
    var allMarkers = [];
    // 存储当前要删除的点标记
    var currentMarker = null;
    function ContextMenu(map) {
        var me = this;
        //地图中添加鼠标工具MouseTool插件
        this.mouseTool = new AMap.MouseTool(map);
        this.contextMenuPositon = null;
        
        var content = [];
        content.push("<div class='info context_menu'>");
        content.push("  <p class='split_line' onclick='menu.distanceMeasureMenu()'>距离量测</p>");
        content.push("  <p onclick='menu.addMarkerMenu()'>添加标记</p>");
        content.push("</div>");

        //通过content自定义右键菜单内容
        this.contextMenu = new AMap.ContextMenu({isCustom: true, content: content.join('')});

        //地图绑定鼠标右击事件——弹出右键菜单
        map.on('rightclick', function (e) {
            if (isDrawing) {
                me.contextMenu.close();
                // 结束当前绘制但不关闭工具，允许继续绘制新线
                me.mouseTool.rule();
            } else {
                me.contextMenu.open(map, e.lnglat);
                me.contextMenuPositon = e.lnglat; //右键菜单位置
            }
        });
    }

    ContextMenu.prototype.distanceMeasureMenu = function () {  //右键菜单距离量测
        if (isDrawing) {
            // 如果正在绘制，先关闭当前绘制
            this.mouseTool.close();
        }
        // 开始新的绘制
        this.mouseTool.rule();
        this.contextMenu.close();
        // 标记当前正在绘制距离量测
        isDrawing = true;
    };

    // 监听键盘ESC键，退出绘制功能
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
            // 按下ESC键，停止所有绘制
            menu.mouseTool.close();
            // 重置绘制状态
            isDrawing = false;
        }
    });


    //创建点标记右键菜单
    var markerContextMenu = new AMap.ContextMenu();
    markerContextMenu.addItem("删除点标记", function () {
        if (currentMarker) {
            // 从地图上移除点标记
            map.remove(currentMarker);
            // 从数组中移除点标记
            var index = allMarkers.indexOf(currentMarker);
            if (index > -1) {
                allMarkers.splice(index, 1);
            }
            // 清空当前标记引用
            currentMarker = null;
            // 关闭右键菜单
            markerContextMenu.close();
        }
    }, 0);
    ContextMenu.prototype.addMarkerMenu = function () {  //右键菜单添加Marker标记
        this.mouseTool.close();
        var marker = new AMap.Marker({
            map: map,
            position: this.contextMenuPositon || map.getCenter(), //基点位置
            icon: 'https://a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-red.png',
            offset: new AMap.Pixel(-9, -23) // 设置偏移，使标记中心点与点击位置对齐
        });
        // 将新创建的点标记添加到数组中
        allMarkers.push(marker);
        this.contextMenu.close();
        //绑定鼠标右击事件——弹出右键菜单
        marker.on('rightclick', function (e) {
            markerContextMenu.open(map, e.lnglat);
            // 将当前点标记存储到全局变量中，以便删除时使用
            currentMarker = this;
        });
    };
    //创建右键菜单
    var menu = new ContextMenu(map);
    // menu.contextMenu.open(map, lnglat);


    //map.clearMap();  // 清除地图覆盖物

    // var heatmapData=[{
    //                 "lng": 116.191031,
    //                 "lat": 39.988585,
    //                 "count": 10
    //               }, {
    //                 "lng": 116.389275,
    //                 "lat": 39.925818,
    //                 "count": 11
    //               }, {
    //                 "lng": 116.287444,
    //                 "lat": 39.810742,
    //                 "count": 12
    //               }, {
    //                 "lng": 116.481707,
    //                 "lat": 39.940089,
    //                 "count": 13
    //               },
    //             ]

    if (!isSupportCanvas()) {
        alert('热力图仅对支持canvas的浏览器适用,您所使用的浏览器不能使用热力图功能,请换个浏览器试试~')
    }

    //详细的参数,可以查看heatmap.js的文档 http://www.patrick-wied.at/static/heatmapjs/docs.html
    //参数说明如下:
    /* visible 热力图是否显示,默认为true
     * opacity 热力图的透明度,分别对应heatmap.js的minOpacity和maxOpacity
     * radius 势力图的每个点的半径大小
     * gradient  {JSON} 热力图的渐变区间 . gradient如下所示
     *	{
     .2:'rgb(0, 255, 255)',
     .5:'rgb(0, 110, 255)',
     .8:'rgb(100, 0, 255)'
     }
     其中 key 表示插值的位置, 0-1
     value 为颜色值
     */
    var heatmap;
    map.plugin(["AMap.HeatMap"], function () {
        //初始化heatmap对象
        heatmap = new AMap.HeatMap(map, {
            radius: 25, //给定半径
            opacity: [0, 0.8]
            /*,
            gradient:{
                0.5: 'blue',
                0.65: 'rgb(117,211,248)',
                0.7: 'rgb(0, 255, 0)',
                0.9: '#ffea00',
                1.0: 'red'
            }
             */
        });
        //设置数据集：该数据为北京部分“公园”数据
        heatmap.setDataSet({
            data: heatmapData,
            max: 100
        });
    });

    //判断浏览区是否支持canvas
    function isSupportCanvas() {
        var elem = document.createElement('canvas');
        return !!(elem.getContext && elem.getContext('2d'));
    }
    heatmap.show()




    var center = map.getCenter();
    // map.setFitView();

    // var centerText = '当前中心点坐标：' + center.getLng() + ',' + center.getLat();
    // document.getElementById('centerCoord').innerHTML = centerText;
    // document.getElementById('tips').innerHTML = '成功添加三个点标记，其中有两个在当前地图视野外！';

    var setFitViewBtn = document.getElementById('setFitView');
    // 添加事件监听, 使地图自适应显示到合适的范围
    setFitViewBtn.onclick = function() {
        if (heatmapData && heatmapData.length > 0) {
            // 手动计算热力图数据的经纬度范围
            var tempMarkers = [];
            heatmapData.forEach(function(item) {
              var marker = new AMap.Marker({
                  position: [item.lng, item.lat],
                  visible: false  // 不显示，只用于计算视野
              });
              tempMarkers.push(marker);
            });
            // 设置地图视野以适应热力图范围
            map.setFitView(tempMarkers, false, [60, 60, 60, 60]);
        } else {
            // 如果没有热力图数据，使用默认的setFitView
            map.setFitView(null);
        }
        // var newCenter = map.getCenter();
        // document.getElementById('centerCoord').innerHTML = '当前中心点坐标：' + newCenter.toString();
        // document.getElementById('tips').innerHTML = '通过setFitView，地图自适应显示到合适的范围内,点标记已全部显示在视野中！';
    };
    setFitViewBtn.onclick();
</script>
</body>
</html>
